<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fff">
<title>Exposure Scale QR</title>
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-display: swap;
    src: url("../fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; background: #fff; color: #000; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; font: 500 18px/1.3 "IBM Plex Sans", system-ui, sans-serif;
  }
  /* The SVG carries its own white quiet zone, so it can run edge to edge. */
  img { display: block; width: min(100vw, calc(100dvh - 48px)); height: auto; aspect-ratio: 1; }
  p { margin: 0; }
</style>
</head>
<body>
<img src="qr.svg" alt="QR code for yaedin.github.io/exposure-scale">
<p>yaedin.github.io/exposure-scale</p>
<script>
  // Keep the phone screen on while the code is shown.
  const lock = () => navigator.wakeLock?.request("screen").catch(() => {});
  lock();
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && lock());
</script>
</body>
</html>
